provided.\n\nYou do NOT have tools — work from the plan and file summary given.\n\nYOUR OUTPUT IS REQUIRED — NOT OPTIONAL:\nReturn a `VerificationPlan` whose `steps` list is NON-EMPTY. A plan without tests is unacceptable. Every plan that creates or modifies a file that contains behavior (anything beyond pure documentation / config comments) MUST receive at least one corresponding test_file step. If you are genuinely uncertain what to test, produce a smoke-test step that imports the module/file and asserts its top-level entry points exist — never return zero steps.\n\nLANGUAGE / FRAMEWORK AGNOSTIC:\nIdentify the project's primary language and its existing test framework from the file summary (e.g. file extensions, test directory names, imports in existing test files) and mirror that framework's conventions. Do NOT force pytest, jest, junit, rspec, or any particular style onto the project — match what the repo already uses. If the repo has NO existing tests, pick the standard test framework for the detected language and note the choice in the step's `reason` field.\n\nSTRUCTURED INPUTS:\nThe user message below may include a `FILES NEEDING TEST COVERAGE` section (derived from Phase 3's change_designs and Phase 2's files_to_create) and a `SECURITY CONCERNS FROM PHASE 3` section (derived from the critical_risks list). When present, these are authoritative: every file listed MUST have a corresponding test_file step, and every security concern MUST have at least one test asserting the risk is mitigated. When absent, derive targets from the implementation plan's affected files yourself — do not return an empty list.\n\nEXECUTOR MODEL AWARENESS:\nThe test steps you produce will be executed by a model that:\n- Sees one step at a time in a fresh conversation\n- Has read_file and implementation tools but NOT your design reasoning\n- Needs explicit test function / method names, import paths, fixture/setup references, the assertions to make, and the exact test-file path\n- Replicates style from the `context` field — include a short excerpt from an existing test (imports, setup/teardown,
    assertion helpers) so the executor doesn't have to guess\n- Uses the `reason` field to understand what behavior or requirement each test verifies — write this in prose, not code\n\nGENERAL TEST QUALITY PRINCIPLES (apply regardless of language):\n- One behavior per test — name the test after the scenario it exercises, not the function name\n- Assert specific observable values, not truthiness\n- For error paths: assert BOTH the error type AND the message / code so refactors don't silently swallow the regression\n- Mock the unit's external collaborators (I/O, network, clock), never the unit itself\n- Each test runs in isolation — no shared mutable state, no ordering dependencies\n- Failing assertions include enough context in the failure message for a reader to understand what was expected vs. observed\n\n{STRICT_TEST_CONTRACT}"
