[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lean-ai"
version = "0.1.0"
description = "Lean agentic coding assistant — plan well, give the LLM tools, let it work"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.34.0,<1.0",
    "aiosqlite>=0.20.0,<1.0",
    "pydantic>=2.10.0,<3.0",
    "pydantic-settings[yaml]>=2.7.0,<3.0",
    "cryptography>=44.0.0",
    "ollama>=0.4.0,<1.0",
    "whoosh>=2.7.4,<3.0",
    "beautifulsoup4>=4.12.0,<5.0",
    "httpx>=0.28.0,<1.0",
    "ruamel.yaml>=0.18.0,<0.19",
    "pathspec>=0.12.0,<2.0",
    "websockets>=13.0,<17.0",
    "duckduckgo-search>=7.0.0,<8.0",
    "tree-sitter>=0.24.0,<1.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-ruby>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-c-sharp>=0.23.0",
    "tree-sitter-php>=0.23.0",
    "tree-sitter-css>=0.23.0",
    "tree-sitter-html>=0.23.0",
]

[project.optional-dependencies]
openai = [
    "openai>=1.30.0,<2.0",
]
anthropic = [
    "anthropic>=0.30.0,<1.0",
]
reference = [
    "ebooklib>=0.18,<1.0",
    "pypdf>=6.10.2,<7.0",
    "python-docx>=1.1.0,<2.0",
]
gemini = [
    "google-genai>=1.0.0,<2.0",
]
google = [
    "selenium>=4.25.0,<5.0",
]
voice = [
    "faster-whisper>=1.2.1",
    "kokoro-onnx>=0.4.0",
    "soundfile",
    "openwakeword",
    "PyAudio",
]
ui-verification = [
    "playwright>=1.48.0,<2.0",
    "mss>=9.0.0,<11.0",
    "Pillow>=10.0.0,<12.0",
    "numpy>=1.26.0,<3.0",
    "pygetwindow>=0.0.9",
    "pywin32>=306; sys_platform == 'win32'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "dbus-next>=0.2.3; sys_platform == 'linux'",
]
dev = [
    "pytest>=8.0.0,<10.0",
    "pytest-asyncio>=0.24.0,<2.0",
    "ruff>=0.8.0,<1.0",
]

[project.scripts]
lean-ai = "lean_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lean_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Disable the cacheprovider plugin: back-to-back pytest runs hung at
# process exit (futex wait) when the cache was enabled, even though the
# test phase itself completed in ~3.8s. We don't use --lf / --ff / --nf
# anywhere, so the cache provides no value in exchange for the flaky
# exit behaviour.
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "ARG", "SIM", "RUF", "PERF", "C4", "RET"]
ignore = [
    "ARG001",   # Unused function argument — callbacks, event handlers, protocol stubs
    "ARG002",   # Unused method argument — ABC/interface implementations
    "ARG004",   # Unused static method argument
    "B905",     # zip() without strict= — lengths are guaranteed in most call sites
    "PERF203",  # try-except in loop — sometimes necessary (e.g. schema migrations)
    "PERF401",  # List comprehension vs for-loop append — often less readable
    "RET504",   # Unnecessary assignment before return — sometimes clearer
    "RET505",   # Unnecessary else after return — sometimes clearer with explicit else
    "RUF002",   # Ambiguous unicode in docstring — intentional (en-dash, multiplication sign)
    "RUF003",   # Ambiguous unicode in comment — intentional
    "RUF059",   # Unused unpacked variable — common in tuple unpacking patterns
    "SIM102",   # Nested if — sometimes more readable than combined condition
    "SIM105",   # contextlib.suppress — try/except/pass is often clearer
    "SIM108",   # Ternary operator — often less readable
    "RUF006",   # Store asyncio.create_task reference — intentional fire-and-forget
]
