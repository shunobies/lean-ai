on:
  push:
    tags:
      - "v*"

name: Deploy Extension

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Test first-run Python discovery
        run: npm test -- --runTestsByPath src/__tests__/pythonDiscovery.test.ts
      - name: Verify tag matches extension version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "v$PACKAGE_VERSION" = "$GITHUB_REF_NAME"
      - run: npm run package
      - name: Locate and verify VSIX
        id: package
        shell: bash
        run: |
          VSIX_PATH="$(find "$PWD" -maxdepth 1 -name 'lean-ai-*.vsix' -print -quit)"
          test -n "$VSIX_PATH"
          npm run verify-package -- "$VSIX_PATH"
          echo "vsixPath=$VSIX_PATH" >> "$GITHUB_OUTPUT"
      - name: Publish to Open VSX Registry
        uses: HaaLeo/publish-vscode-extension@v2
        id: publishToOpenVSX
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          extensionFile: ${{ steps.package.outputs.vsixPath }}
      - name: Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ${{ steps.package.outputs.vsixPath }}
